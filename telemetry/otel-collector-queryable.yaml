# Start Loki :3100 and Jaeger OTLP/HTTP :4319 before using this config.
# Keep otel-collector-config.yaml for standalone debug tracing checks.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:

exporters:
  otlphttp/jaeger:
    endpoint: http://127.0.0.1:4319
  otlphttp/loki:
    endpoint: http://127.0.0.1:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/jaeger]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
